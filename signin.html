<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Explore Adobe Signin clone and premium solutions.">
    <meta name="keywords" content="Adobe, Signin, Creative Cloud, Design">
    <meta name="author" content="Adobe Clone Developer">


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adobe Sign In</title>

<!-- Bootstrap 5 -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Global Style -->
<link rel="stylesheet" href="css/style.css">
<!-- Page Specific Style -->
<link rel="stylesheet" href="css/signin.css">

</head>

<body>
    <!-- Page Loader Screen -->
    <div id="loader-wrapper">
        <div class="loader-spinner"></div>
        <div class="loader-logo">Adobe</div>
    </div>

    <!-- Scroll Progress Bar -->
    <div id="scroll-progress"></div>


<section class="signin-section">

<div class="signin-container" data-anim="zoom-in">

<div class="logo">

<a href="index.html" style="text-decoration: none; color: inherit;">
    <h1>Adobe</h1>
</a>

</div>

<h2>Sign In</h2>

<form id="signinForm" novalidate>

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email">

<div id="email-error" class="error-message"></div>

</div>

<div class="form-group">

<label for="password">
Password
</label>

<div class="password-wrapper">
<input
type="password"
id="password"
placeholder="Enter your password">

<button type="button" id="togglePassword" class="toggle-password-btn" aria-label="Toggle Password Visibility">
<i class="bi bi-eye"></i>
</button>
</div>

<div id="password-error" class="error-message"></div>

</div>

<div class="options">

<label>

<input type="checkbox" id="rememberMe">

Remember Me

</label>

<a href="#">
Forgot Password?
</a>

</div>

<button type="submit"
id="submitBtn"
class="signin-btn btn-ripple">

<span class="btn-text">Sign In</span>
<span class="spinner-border spinner-border-sm btn-spinner" role="status" aria-hidden="true" style="display: none; margin-left: 8px;"></span>

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<div class="social-login">

<button class="google-btn btn-ripple">

Google

</button>

<button class="facebook-btn btn-ripple">

Facebook

</button>

</div>

<p class="signup-text">

Don't have an account?

<a href="#">
Create Account
</a>

</p>

</div>

</section>


    <!-- Back to Top Button -->
    <button id="back-to-top" class="btn" aria-label="Back to Top"><i class="bi bi-arrow-up"></i></button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/signin.js"></script>

</body>

</html>
