<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="description" content="Explore Adobe Signin clone and premium solutions.">
    <meta name="keywords" content="Adobe, Signin, Creative Cloud, Design">
    <meta name="author" content="Adobe Clone Developer">


<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Adobe Sign In</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="css/signin.css">

</head>

<body>
    <!-- Page Loader Screen -->
    <div id="loader-wrapper">
        <div class="loader-spinner"></div>
        <div class="loader-logo">Adobe</div>
    </div>

    <!-- Scroll Progress Bar -->
    <div id="scroll-progress"></div>


<section class="signin-section">

<div class="signin-container" data-anim="zoom-in">

<div class="logo">

<a href="index.html" style="text-decoration: none; color: inherit;">
    <h1>Adobe</h1>
</a>

</div>

<h2>Sign In</h2>

<form id="signinForm">

<div class="form-group">

<label for="email">
Email Address
</label>

<input
type="email"
id="email"
placeholder="Enter your email"
required>

</div>

<div class="form-group">

<label for="password">
Password
</label>

<input
type="password"
id="password"
placeholder="Enter your password"
required>

</div>

<div class="options">

<label>

<input type="checkbox">

Remember Me

</label>

<a href="#">
Forgot Password?
</a>

</div>

<button type="submit"
class="signin-btn btn-ripple">

Sign In

</button>

</form>

<div class="divider">

<span>OR</span>

</div>

<div class="social-login">

<button class="google-btn btn-ripple">

Google

</button>

<button class="facebook-btn btn-ripple">

Facebook

</button>

</div>

<p class="signup-text">

Don't have an account?

<a href="#">
Create Account
</a>

</p>

</div>

</section>


    <!-- Back to Top Button -->
    <button id="back-to-top" class="btn" aria-label="Back to Top"><i class="bi bi-arrow-up"></i></button>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


<script src="js/signin.js"></script>

</body>

</html>
